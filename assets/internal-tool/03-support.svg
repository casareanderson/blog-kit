<svg xmlns="http://www.w3.org/2000/svg" width="880" height="410" viewBox="0 0 880 410" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="880" height="410" fill="#ffffff"/>
  <text x="40" y="46" font-size="21" font-weight="700" fill="#111827">Support access without becoming the customer</text>
  <text x="40" y="72" font-size="14" fill="#6b7280">A scope switch, not an impersonation. I stay myself; their data renders; both logs record it.</text>

  <rect x="40" y="100" width="360" height="120" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="60" y="128" font-size="15" font-weight="700" fill="#991b1b">✗ Log in as them</text>
  <text x="60" y="154" font-size="13" fill="#374151">Easier to build. Renders the same screens.</text>
  <text x="60" y="176" font-size="13" font-weight="600" fill="#991b1b">Cost: no line in their history can be</text>
  <text x="60" y="196" font-size="13" font-weight="600" fill="#991b1b">trusted to mean the person it names did it.</text>

  <rect x="440" y="100" width="400" height="120" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="460" y="128" font-size="15" font-weight="700" fill="#166534">✓ Switch scope, stay yourself</text>
  <text x="460" y="154" font-size="13" fill="#374151">Banner on every page. Owner-only settings denied</text>
  <text x="460" y="176" font-size="13" fill="#374151">while inside. Entering and leaving both written</text>
  <text x="460" y="196" font-size="13" fill="#374151">to two separate logs.</text>

  <rect x="40" y="248" width="390" height="128" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="60" y="274" font-size="13" font-weight="700" fill="#111827">The client's log</text>
  <text x="60" y="296" font-size="12" fill="#6b7280">so they can see a stranger in their data</text>
  <text x="60" y="326" font-size="12" fill="#374151" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">chris (install owner) started</text>
  <text x="60" y="346" font-size="12" fill="#374151" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">working in this client</text>

  <rect x="450" y="248" width="390" height="128" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="470" y="274" font-size="13" font-weight="700" fill="#111827">The owner's log</text>
  <text x="470" y="296" font-size="12" fill="#6b7280">so it survives that client being deleted</text>
  <text x="470" y="326" font-size="12" fill="#374151" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">chris started working as</text>
  <text x="470" y="346" font-size="12" fill="#374151" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">'Northgate Trading'</text>
</svg>
