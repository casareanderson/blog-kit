<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="880" height="430" fill="#ffffff"/>
  <text x="40" y="46" font-size="21" font-weight="700" fill="#111827">The tool is glue. The glue should be thin.</text>
  <text x="40" y="72" font-size="14" fill="#6b7280">Nothing heavy runs inside the container — every dependency is a URL to something already running.</text>

  <!-- container -->
  <rect x="316" y="160" width="248" height="128" rx="12" fill="#111827"/>
  <text x="440" y="196" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle">The tool</text>
  <text x="440" y="222" font-size="13" fill="#9ca3af" text-anchor="middle">Python · SQLite · templates</text>
  <text x="440" y="246" font-size="13" fill="#9ca3af" text-anchor="middle">the only thing I wrote</text>
  <text x="440" y="270" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle">239 MB</text>

  <!-- deps -->
  <g font-size="13">
    <rect x="40" y="112" width="216" height="62" rx="9" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="56" y="136" font-weight="600" fill="#111827">Vision + language</text>
    <text x="56" y="157" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">gpu-box.lan:11434</text>

    <rect x="40" y="196" width="216" height="62" rx="9" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="56" y="220" font-weight="600" fill="#111827">Metasearch</text>
    <text x="56" y="241" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">tools.lan:8888</text>

    <rect x="40" y="280" width="216" height="62" rx="9" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="56" y="304" font-weight="600" fill="#111827">Crawler</text>
    <text x="56" y="325" fill="#6b7280" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">tools.lan:11235</text>

    <rect x="624" y="154" width="216" height="62" rx="9" fill="#f3f4f6" stroke="#d1d5db"/>
    <text x="640" y="178" font-weight="600" fill="#111827">Object store</text>
    <text x="640" y="199" fill="#6b7280">photos, presigned</text>

    <rect x="624" y="238" width="216" height="62" rx="9" fill="#eef2ff" stroke="#c7d2fe"/>
    <text x="640" y="262" font-weight="600" fill="#3730a3">The vendor API</text>
    <text x="640" y="283" fill="#6366f1">the boring part</text>
  </g>

  <g stroke="#9ca3af" stroke-width="1.6" fill="none">
    <path d="M256 143 C 290 143, 286 200, 314 208"/>
    <path d="M256 227 H 314"/>
    <path d="M256 311 C 290 311, 286 252, 314 240"/>
    <path d="M566 208 C 596 208, 592 185, 622 185"/>
    <path d="M566 240 C 596 240, 592 269, 622 269"/>
  </g>

  <text x="40" y="386" font-size="13" fill="#374151">Container holds no model weights, no browser, no search index — so photos stay on the LAN,</text>
  <text x="40" y="406" font-size="13" fill="#374151">and every dependency is swappable at the URL level.</text>
</svg>
