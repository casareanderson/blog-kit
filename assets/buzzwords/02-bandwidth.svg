<svg xmlns="http://www.w3.org/2000/svg" width="880" height="380" viewBox="0 0 880 380" font-family="Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="880" height="380" fill="#ffffff"/>
  <text x="40" y="46" font-size="21" font-weight="700" fill="#111827">Speed is not about the chip. It is about what fits.</text>
  <text x="40" y="72" font-size="14" fill="#6b7280">For every token, the machine reads through the whole model. So the limit is memory speed, not maths.</text>

  <text x="40" y="112" font-size="13" font-weight="600" fill="#111827">A 7.7 GB model, on a 6 GB card that is already busy</text>

  <rect x="40" y="128" width="380" height="150" rx="10" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="60" y="154" font-size="13" font-weight="600" fill="#111827">The graphics card — 6144 MB</text>
  <rect x="60" y="168" width="340" height="26" rx="4" fill="#e5e7eb"/>
  <rect x="60" y="168" width="259" height="26" rx="4" fill="#9ca3af"/>
  <text x="66" y="186" font-size="11" fill="#111827">already in use 4685 MB</text>
  <rect x="60" y="200" width="340" height="26" rx="4" fill="#e5e7eb"/>
  <rect x="60" y="200" width="44" height="26" rx="4" fill="#34d399"/>
  <text x="112" y="218" font-size="11" fill="#374151">the model got 0.8 GB in here</text>
  <text x="60" y="252" font-size="12" fill="#6b7280">fast memory — hundreds of GB/s</text>

  <rect x="452" y="128" width="388" height="150" rx="10" fill="#fef2f2" stroke="#fecaca"/>
  <text x="472" y="154" font-size="13" font-weight="600" fill="#991b1b">System memory — the other 90%</text>
  <rect x="472" y="168" width="348" height="58" rx="4" fill="#fecaca"/>
  <text x="482" y="203" font-size="12" fill="#7f1d1d">6.9 GB of the model ended up here</text>
  <text x="472" y="252" font-size="12" fill="#991b1b">several times slower — and nothing said so</text>

  <rect x="40" y="300" width="800" height="60" rx="8" fill="#111827"/>
  <text x="60" y="326" font-size="13" font-weight="600" fill="#ffffff">Same model, same question: 23.8 tokens/sec when it fits — 5.3 when it does not.</text>
  <text x="60" y="348" font-size="13" fill="#9ca3af">No error, no warning. It just feels slow. If a model is inexplicably slow, check how much of it actually fits.</text>
</svg>
